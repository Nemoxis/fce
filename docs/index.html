<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <title>Orari bus FCE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <img class="appbar-logo" src="icons/logo-fce.png" alt="FCE" width="132" height="40">
    <span class="unofficial">Non ufficiale</span>
  </header>

  <div class="hello">
    <p class="hello-small">Orari bus</p>
    <p id="validity" class="validity">Carico gli orari…</p>
  </div>

  <div id="alert" class="alert" role="alert" hidden></div>
  <div id="banner" class="banner" hidden></div>

  <main>
    <h2 class="section-title">Cerca corse</h2>
    <section class="journey" aria-label="Scegli il viaggio">
      <div class="field">
        <label for="from">Da</label>
        <div class="combo">
          <input id="from" autocomplete="off" placeholder="Fermata di partenza" role="combobox" aria-expanded="false" aria-controls="from-list">
          <ul id="from-list" class="options" role="listbox" hidden></ul>
        </div>
      </div>
      <button id="swap" class="swap" type="button" aria-label="Inverti partenza e arrivo" title="Inverti">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="field">
        <label for="to">A</label>
        <div class="combo">
          <input id="to" autocomplete="off" placeholder="Fermata di arrivo" role="combobox" aria-expanded="false" aria-controls="to-list">
          <ul id="to-list" class="options" role="listbox" hidden></ul>
        </div>
      </div>
    </section>

    <section class="when" aria-label="Quando">
      <div class="chips" role="group" aria-label="Giorno">
        <button type="button" class="chip" data-day="0">Oggi</button>
        <button type="button" class="chip" data-day="1">Domani</button>
      </div>
      <input type="date" id="date" aria-label="Altra data">
      <div class="from-time">
        <label for="time">Dalle</label> <input type="time" id="time">
        <button type="button" id="now" class="now" hidden>Adesso</button>
      </div>
    </section>

    <div id="favs" class="favs"></div>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <p id="source"></p>
    <p>App non ufficiale, non affiliata a Ferrovia Circumetnea. I dati sono estratti automaticamente dai PDF pubblicati da FCE: in caso di dubbio fa fede l'orario ufficiale.</p>
  </footer>

  <template id="trip-tpl">
    <li class="trip">
      <button type="button" class="trip-main" aria-expanded="false">
        <span class="dep"></span>
        <span class="track" aria-hidden="true"><span class="rail"></span></span>
        <span class="arr"></span>
        <span class="meta"></span>
        <span class="tags"></span>
      </button>
      <ol class="stops" hidden></ol>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
